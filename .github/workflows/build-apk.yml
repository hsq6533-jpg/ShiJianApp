name: Build Debug APK

# 触发条件：推送到 main 分支 或 手动点击 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (direct console + extract error lines)
        shell: bash
        run: |
          chmod +x gradlew
          # 直接输出到 Actions log，同时保存文件；不通过 pipe，确保 exit code 正确
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $EXIT"
          # 提取失败原因相关行 -> ::warning annotations（方便不登录查看）
          if [ -f build-output.log ]; then
            echo "===== grep FAILURE/What went wrong/Caused by/e:/error: ====="
            grep -n -iE "^FAILURE|^\* What went wrong|^Caused by:|^e: |^error:|^\* Try:|^\* Exception is:|Execution failed for task|Compilation error|kotlin:|Unresolved reference|Type mismatch" build-output.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::gradle-fail: $safe"
            done || true
            echo "===== head -n 60 build-output.log ====="
            head -n 60 build-output.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::gradle-head: $safe"
            done || true
            echo "===== tail -n 60 build-output.log ====="
            tail -n 60 build-output.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::gradle-tail: $safe"
            done || true
          fi
          if [ $EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $EXIT (see warnings above for FAILURE/What went wrong lines)"
          fi
          exit $EXIT

      - name: Upload build output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shijian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish APK to Catbox.moe (public direct link, no login needed)
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          echo "Uploading $APK_PATH to catbox.moe ..."
          RESP=$(curl -s -S -F "reqtype=fileupload" -F "fileToUpload=@$APK_PATH" https://catbox.moe/user/api.php)
          echo "catbox response: $RESP"
          if echo "$RESP" | grep -qE "^https?://"; then
            echo "::notice title=APK 公开直链(无需登录)::${RESP}"
            # 同时写进 warning，确保在 Annotations 列表顶部可见
            SAFE=$(printf '%s' "$RESP" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::warning title=📦 APK 下载直链(点不开就复制到浏览器)::${SAFE}"
          else
            echo "::warning::catbox 上传失败，响应: $RESP"
            echo "尝试 0x0.st 兜底..."
            RESP2=$(curl -s -S -F "file=@$APK_PATH" https://0x0.st) || true
            echo "0x0.st response: $RESP2"
            if echo "$RESP2" | grep -qE "^https?://"; then
              SAFE=$(printf '%s' "$RESP2" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning title=📦 APK 下载直链(0x0.st 兜底)::${SAFE}"
            else
              echo "::warning::0x0.st 也失败: $RESP2"
              echo "::notice::两种公开托管均不可用，请登录 GitHub 从 Artifacts 下载"
            fi
          fi
