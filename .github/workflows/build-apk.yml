name: Build Debug APK

# 触发条件：推送到 main 分支 或 手动点击 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (direct console + extract error lines)
        shell: bash
        run: |
          chmod +x gradlew
          # 直接输出到 Actions log，同时保存文件；不通过 pipe，确保 exit code 正确
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $EXIT"
          # 提取失败原因相关行 -> ::warning annotations（方便不登录查看）
          if [ -f build-output.log ]; then
            echo "===== grep FAILURE/What went wrong/Caused by/e:/error: ====="
            grep -n -iE "^FAILURE|^\* What went wrong|^Caused by:|^e: |^error:|^\* Try:|^\* Exception is:|Execution failed for task|Compilation error|kotlin:|Unresolved reference|Type mismatch" build-output.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::gradle-fail: $safe"
            done || true
            echo "===== head -n 60 build-output.log ====="
            head -n 60 build-output.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::gradle-head: $safe"
            done || true
            echo "===== tail -n 60 build-output.log ====="
            tail -n 60 build-output.log | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::gradle-tail: $safe"
            done || true
          fi
          if [ $EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $EXIT (see warnings above for FAILURE/What went wrong lines)"
          fi
          exit $EXIT

      - name: Upload build output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shijian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish APK to public hosts (direct links, no login)
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          emit_link() {
            local title="$1" link="$2"
            echo "::notice title=APK 直链(${title})::${link}"
            local safe
            safe=$(printf '%s' "$link" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::warning title=📦 APK下载直链(${title})::${safe}"
          }

          # 方案1: Litterbox (Catbox 临时上传, 72 小时)
          echo "[1/3] Uploading to litterbox.catbox.moe (72h)..."
          R1=$(curl -s -S -A "$UA" \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@$APK_PATH" \
            https://litterbox.catbox.moe/resources/internals/api.php) || true
          echo "litterbox response: $R1"
          if echo "$R1" | grep -qE "^https?://"; then
            emit_link "Litterbox 72h" "$R1"
            exit 0
          fi
          echo "::warning::litterbox 失败: $R1"

          # 方案2: transfer.sh (14 天)
          echo "[2/3] Uploading to transfer.sh (14d)..."
          R2=$(curl -s -S -A "$UA" --upload-file "$APK_PATH" \
            "https://transfer.sh/ShiJianApp-debug.apk") || true
          echo "transfer.sh response: $R2"
          if echo "$R2" | grep -qE "^https?://"; then
            emit_link "Transfer.sh 14d" "$R2"
            exit 0
          fi
          echo "::warning::transfer.sh 失败: $R2"

          # 方案3: file.io (14 天, 1 次下载后删除, 或手动选 14d 未访问才删)
          echo "[3/3] Uploading to file.io (14d)..."
          R3=$(curl -s -S -A "$UA" \
            -F "file=@$APK_PATH" \
            "https://file.io?expires=14d") || true
          echo "file.io response: $R3"
          LINK3=$(echo "$R3" | sed -n 's/.*"link":"\([^"]*\)".*/\1/p')
          if [ -n "$LINK3" ]; then
            emit_link "File.io 14d" "$LINK3"
            exit 0
          fi
          echo "::warning::file.io 失败: $R3"

          echo "::error::三种公开托管全部失败，请登录 GitHub 从 Artifacts 下载 APK"
