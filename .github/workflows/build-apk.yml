name: Build Debug APK

# 触发条件：推送到 main 分支 或 手动点击 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace > build-output.log 2>&1
          EXIT=$?
          echo "gradle exit code: $EXIT"
          # 上传到 0x0.st 方便排查（公开链接，7天后自动过期）
          if [ -f build-output.log ]; then
            URL=$(curl -s -F "file=@build-output.log" https://0x0.st || true)
            if [ -n "$URL" ]; then
              safe=$(printf '%s' "$URL" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::warning::build-output-log uploaded to: $safe"
            fi
          fi
          exit $EXIT

      - name: Upload build output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shijian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
