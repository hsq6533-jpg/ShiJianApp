name: Build Debug APK

# 触发条件：推送到 main 分支 或 手动点击 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (direct to console + save log)
        shell: bash
        run: |
          chmod +x gradlew
          # 直接输出到 Actions log，同时保存文件；不通过 pipe，确保 exit code 正确
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "gradle exit code: $EXIT"
          # 尝试把 log 最后 30 行 echo 成 ::warning 方便不登录查看
          tail -n 30 build-output.log | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::warning::gradle: $safe"
          done || true
          if [ $EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $EXIT (see step log above)"
          fi
          exit $EXIT

      - name: Upload build output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shijian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
